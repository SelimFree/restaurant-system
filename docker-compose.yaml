services:
  api:
    build: ./app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./app/db/init-scripts:/docker-entrypoint-initdb.d
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"

  redis:
    image: redis:7

  # worker:
  #   build: ./app
  #   command: uvicorn worker_main:app --host 0.0.0.0 --port 8001
  #   volumes:
  #     - ./app:/app
  #   env_file:
  #     - ./.env
  #   depends_on:
  #     - redis
  #     - db

  reverse-proxy:
      image: nginx:latest
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
        - ./frontend-builds:/usr/share/nginx/html
      depends_on:
        - api
        # - worker

volumes:
  postgres_data: